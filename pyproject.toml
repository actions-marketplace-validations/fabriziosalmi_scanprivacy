[build-system]
requires = ["setuptools>=77"]  # PEP 639: SPDX `license` string and `license-files`
build-backend = "setuptools.build_meta"

[project]
name = "scanprivacy"
version = "0.1.0"
description = "URL in, findings graph + remediation out. Passive, legit-only EU privacy conformance engine."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Fabrizio Salmi" }]
# AGPL, not Apache, and the reason is section 13. This engine's natural
# deployment is a network service: someone runs `scanprivacy serve` behind a domain
# and never ships a binary to anyone. Under a permissive licence that operator
# owes the project nothing, which is the one case the AGPL was written for.
# Running it privately, scanning your own estate, or wiring it into your CI
# costs you nothing extra — the obligation only attaches when you offer it to
# others over a network.
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
# Upper bounds are not caution, they are a correctness requirement here. This
# engine publishes configuration digests and signs in-toto statements so that
# two scans can be shown to be the same analysis. An unbounded `>=` means the
# next major of Playwright — a different Chromium, with different defaults for
# storage, referrer and third-party cookies — silently becomes the thing that
# produced the evidence the signature attests to. Pair this with the lockfile
# in requirements.lock, which pins the exact resolution.
dependencies = [
  "playwright>=1.44,<2",
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
  "tldextract>=5,<6",
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "jinja2>=3.1,<4",
  "weasyprint>=60,<70",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "rich>=13,<15"]

[project.scripts]
scanprivacy = "scanprivacy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scanprivacy = [
  "rules/*.yml",
  "rules/*.md",
  "knowledge/*.yml",
  "i18n/locales/*/*.yml",
  "report/templates/*",
]
