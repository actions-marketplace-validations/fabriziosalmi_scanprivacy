<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 304" role="img" aria-labelledby="t d">
  <title id="t">What scanprivacy does</title>
  <desc id="d">A URL goes in. scanprivacy loads the page as a first-time visitor and records requests, cookies and storage writes. It checks them against GDPR, ePrivacy and the AI Act and against the privacy notice the page links. It reports a grade from A to F, and every finding carries its evidence, the steps to verify it and a fix.</desc>
  <style>
    :root {
      --bg: #f5f6f8; --rule: #d8dde4; --ink: #0f141a; --text: #1d2430; --muted: #566171; --accent: #0b57a4;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #131820; --rule: #262d38; --ink: #eef1f5; --text: #cdd4de; --muted: #94a0b0; --accent: #7db4ee; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--text); font-size: 16px; }
    .card { fill: var(--bg); stroke: var(--rule); stroke-width: 1.5; }
    .step { fill: var(--accent); font-size: 14px; font-weight: 600; }
    .title { fill: var(--ink); font-size: 20px; font-weight: 700; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; fill: var(--ink); }
    .note { fill: var(--muted); font-size: 15px; }
    .arrow { stroke: var(--muted); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect class="card" x="1" y="20" width="214" height="232" rx="6"/>
  <text class="step" x="20" y="52">1</text>
  <text class="title" x="20" y="80">Input</text>
  <text class="mono" x="20" y="112">scanprivacy scan</text>
  <text class="mono" x="20" y="134">https://example.org</text>
  <text x="20" y="172">Any public page.</text>
  <text x="20" y="196">Nothing is installed on</text>
  <text x="20" y="220">the site.</text>
  <path class="arrow" d="M223 136h18m-6-6 6 6-6 6"/>
  <rect class="card" x="249" y="20" width="214" height="232" rx="6"/>
  <text class="step" x="268" y="52">2</text>
  <text class="title" x="268" y="80">Observe</text>
  <text x="268" y="112">One visit, as a first-time</text>
  <text x="268" y="136">visitor. Records every</text>
  <text x="268" y="160">request, cookie and</text>
  <text x="268" y="184">storage write. Clicks</text>
  <text x="268" y="208">nothing, accepts nothing.</text>
  <path class="arrow" d="M471 136h18m-6-6 6 6-6 6"/>
  <rect class="card" x="497" y="20" width="214" height="232" rx="6"/>
  <text class="step" x="516" y="52">3</text>
  <text class="title" x="516" y="80">Check</text>
  <text x="516" y="112">Compares it with GDPR,</text>
  <text x="516" y="136">ePrivacy and the AI Act,</text>
  <text x="516" y="160">and with the privacy</text>
  <text x="516" y="184">notice the page links to.</text>
  <path class="arrow" d="M719 136h18m-6-6 6 6-6 6"/>
  <rect class="card" x="745" y="20" width="214" height="232" rx="6"/>
  <text class="step" x="764" y="52">4</text>
  <text class="title" x="764" y="80">Report</text>
  <text x="764" y="112">A grade from A to F.</text>
  <text x="764" y="136">Every finding carries</text>
  <text x="764" y="160">its evidence, how to</text>
  <text x="764" y="184">verify it, and a fix.</text>
  <text class="note" x="480" y="286" text-anchor="middle">Passive: robots.txt honoured, one page load per second per host, no login, no form submitted.</text>
</svg>
