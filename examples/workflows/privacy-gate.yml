# Privacy conformance as a required check.
#
# Copy into .github/workflows/ of the repository that produces the site. On a
# pull request the scan runs against the deployed preview or the live site, the
# findings land in the Security tab anchored to the lines that cause them, and
# the job fails according to `fail-on`.
#
# Adoption without drama: start at `critical`, tighten to `high`, then to
# `not-conformant` once the backlog is triaged. A gate that blocks everything on
# day one gets disabled on day two.

name: privacy

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # a site changes without the repository changing: a supplier adds a tag, a
    # CDN starts serving an extra host. Weekly catches that.
    - cron: "17 6 * * 1"

permissions:
  contents: read
  security-events: write # upload SARIF to code scanning
  id-token: write # keyless signing of the attestation (Fulcio/Rekor)

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # Pinned to a commit, like every other `uses:` here: a version tag can be
      # moved by whoever controls the repository, and this step holds your token.
      # The commit below is the one tagged v0.1.0. To follow a newer release,
      # replace it with that tag's commit (`git ls-remote https://github.com/fabriziosalmi/scanprivacy`)
      # or let Dependabot's github-actions ecosystem propose the change.
      - id: privacy
        uses: fabriziosalmi/scanprivacy@3883ea4763ee0c630c6554aea5e0a6b82af5fa38  # v0.1.0
        with:
          url: https://www.example.org
          fail-on: critical
          source-root: .
          badge-file: .github/badges/privacy.svg
          pdf-file: scanprivacy-report.pdf
          attest: scanprivacy.intoto.json
          sign: cosign-keyless

      - name: Keep the evidence with the run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: scanprivacy-${{ github.sha }}
          path: |
            scanprivacy.json
            scanprivacy.sarif
            scanprivacy-report.pdf
            scanprivacy.intoto.json
            scanprivacy.intoto.json.sigbundle
          retention-days: 90

      - name: Say it in the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const grade = '${{ steps.privacy.outputs.grade }}';
            const findings = '${{ steps.privacy.outputs.findings }}';
            const anchored = '${{ steps.privacy.outputs.anchored }}';
            const digest = '${{ steps.privacy.outputs.evidence-digest }}';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                `**scanprivacy — ${grade}**`,
                ``,
                `${findings} findings, ${anchored} anchored to a source line.`,
                `Details in the Security tab; full evidence in the run artifacts.`,
                ``,
                `<sub>evidence digest \`${digest.slice(0, 16)}…\` — reproduce with `,
                `\`scanprivacy verify scanprivacy.json\`</sub>`,
              ].join('\n')
            });
