# Rule logic. No prose lives here: titles, descriptions and remediation text
# are in i18n/locales/<lang>/rules.yml, legal references are keys resolved
# through i18n/locales/<lang>/references.yml, and ownership and control
# mappings are in knowledge/frameworks.yml.
#
# A reviewer of this file is checking one thing only: does the condition
# describe the fact the rule claims to have found?
id: PM-CNS-01
severity: critical
confidence: certain
subject: vendor
tags:
- consent
- eprivacy
references:
- eprivacy:5.3
- it:privacy-code:122
- it:garante:cookie-2021
- gdpr:7
condition:
  vendor_third_party: true
  # The site answers for the embed it chose, not for what that embed
  # loads inside itself — which it cannot see, configure or prevent.
  vendor_via_embed: false
  vendor_consent_class_any:
  - required
  vendor_storage_access: true
  vendor_resource_type_any:
  - script
  - xhr
  - fetch
  - document
  - iframe
  - eventsource
  - websocket
  - other
remediation:
  source: vendor
  effort: medium
