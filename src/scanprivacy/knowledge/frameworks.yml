# Which role closes a finding, and which control it speaks to.
#
# Language-neutral by construction: owners are canonical values from
# `core.enums.Owner`, controls are reference keys resolved through the locale
# catalogues. A German report cites the same controls in German without this
# file changing.
#
# WARNING, carried into every report: these mappings say a finding is pertinent
# to a control. They do not attest conformity to the scheme — closing a finding
# contributes to a control, it does not satisfy it.
#
# Fields per rule
#   owner             role holding the lever to close it (Owner enum)
#   secondary_owners  who must be involved
#   domains           technical areas, used to group work across findings
#   controls          reference keys, grouped by framework

defaults:
  owner: cto
  secondary_owners: []
  domains: [web]
  controls: {}

rules:
  PM-TRF-01:
    owner: dpo
    secondary_owners: [cto, procurement]
    domains: [privacy-engineering, third-parties, supply-chain]
    controls:
      gdpr: [gdpr:13.1.f, gdpr:28, gdpr:44]
      nis2: [nis2:21.2.d]
      iso_27001: [iso27001:A.5.14, iso27001:A.5.19]
      iso_27701: [iso27701:7.5.1, iso27701:7.2.6]
      soc2: [soc2:P6.1, soc2:CC9.2]

  PM-TRF-02:
    owner: dpo
    secondary_owners: [sysops, procurement]
    domains: [privacy-engineering, infrastructure, supply-chain]
