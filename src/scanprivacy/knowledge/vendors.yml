# Vendor knowledge base — FACTS ONLY.
#
# What a vendor is, where it processes, whether it touches the terminal. No
# prose: remediation is a `pattern` resolved through the locale catalogues, data
# categories are `DataType` keys, the transfer basis is a key. Aliases used to
# find a vendor in a site's own privacy notice are per-language and live in
# i18n/locales/<lang>/vendors.yml — a notice written in German names Google
# Fonts differently from one written in Italian.
#
# Adding a vendor is a data change. It never requires touching code, and after
# this migration it never requires touching a rule either.
#
# Fields
#   id              stable slug, used as the graph node id (vendor:<id>)
#   vendor/product  proper nouns, never translated
#   category        VendorCategory
#   jurisdiction    ISO country of the controlling entity
#   transfer        TransferScope — eea | adequacy | non_eea
#   transfer_basis  key: dpf | scc | dpf_scc | adequacy
#   storage_access  reads or writes terminal storage (the Art. 5(3) trigger)
#   consent_class   ConsentClass — required | technical | uncertain
#   data_types      DataType keys: what leaves the browser at minimum
#   remediation     pattern + optional alternatives and vendor-specific steps
defaults:
  unknown_third_party:
    vendor_key: unknown_third_party
    category: infra
    jurisdiction: unknown
    transfer: non_eea
    storage_access: false
    consent_class: uncertain
    data_types:
    - ip
    - user_agent
    - referer
    - page_viewed
    remediation:
      pattern: identify_unknown
vendors:
