  # GitHub Pages serves a fixed set of response headers and offers no way to add
  # one — no config file, no dashboard, no header rules. Verified against
  # hstspreload.org on 2026-07-29: `github.io` and `fabriziosalmi.github.io` are
  # both `unknown`, so the HSTS finding is *true* there and simultaneously
  # impossible to close on the platform. The report has to say both things.
  response_headers_fixed: true
  data_types:
  - ip
  - request_metadata
  transfer_basis: dpf
  hosts:
  - github.io
  - raw.githubusercontent.com
  - avatars.githubusercontent.com
  - api.github.com
  host_suffixes:
  - .github.io
  - .githubusercontent.com
  remediation:
    pattern: declare_processor
