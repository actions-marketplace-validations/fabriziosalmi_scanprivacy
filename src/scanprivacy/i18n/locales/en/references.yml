# Legal and control references, keyed.
#
# A reference is not a translatable sentence: it is a pointer into a legal
# instrument. Two dimensions are involved and they are NOT the same:
#
#   language      — how the pointer is written ("Art." vs "Artikel")
#   jurisdiction  — which instrument applies (Art. 122 of the Italian privacy
#                   code, §25 TDDDG in Germany, Art. 82 LCEN in France)
#
# Keeping references as keys lets a report be produced in Italian for a German
# controller citing the German transposition. Jurisdiction packs (`de:`, `fr:`)
# get added next to `it:` without touching a single rule.

