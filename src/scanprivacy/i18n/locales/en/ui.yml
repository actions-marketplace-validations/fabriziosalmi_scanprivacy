record:
  vantage:
    label: Observation point
    not_configured: >
      not recorded. Set SCANPRIVACY_VANTAGE to state where the scan was run
      from, or SCANPRIVACY_VANTAGE_LOOKUP to have it looked up. Neither is on by
      default: an engine that asks a third party where it is, on every scan,
      would be doing the thing this report is written to detect.
    lookup_failed: "the configured lookup did not complete"
    declared: "declared by the operator"
    looked_up: "looked up at {endpoint}"
  findings_digest_note: >
    Covers the findings as published. The evidence digest above covers the
    observation they were derived from; this one detects a document whose
    findings were edited after the fact.
  digest_note: Same digests and same target means the same analysis was applied.
  evidence_digest_computed_on: canonical JSON of the "observation" block (sorted keys, no whitespace)
  evidence_digest_note: >
    Identifies this observation; it is not stable across runs, because sites
    change. Its purpose is to tie the report to the attached evidence and to
    reveal later modification.
  rerun:
    - pip install scanprivacy && scanprivacy install-browser
    - "scanprivacy scan {url} --json evidence.json --md report.md --pdf report.pdf"
    - "scanprivacy verify evidence.json   # recomputes every digest in this section"
    - >
      Each individual finding also carries the steps to check it with a browser
      and curl, without this tool.
  parameters:
    user_agent: user agent
    wait_after_domcontentloaded_ms: wait after DOMContentLoaded (ms)
    navigation_timeout_ms: navigation timeout (ms)
    scan_budget_s: per-scan budget (s)
    robots_respected: robots.txt honoured
    max_documents: maximum documents read
    max_requests_recorded: maximum requests recorded
  engine:
    engine: engine
    python: python
    system: system
    playwright: playwright
    browser: browser
    weasyprint: weasyprint

