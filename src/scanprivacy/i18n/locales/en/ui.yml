constraint:
  response_headers_fixed:
    github-pages: >
      GitHub Pages serves a fixed set of response headers and provides no way to
      add one — no configuration file, no dashboard setting, no header rules.
      The finding is true and the exposure is real; it simply cannot be closed
      while the site is served from this platform.

platform:
  wordpress:
    hint: >
      Fixes are usually made in the theme (header.php / functions.php) or by
      disabling the plugin that injects the resource. Check Jetpack (Stats,
      Photon), Gravatar and social sharing plugins.
  astro:
    hint: >
      Static site: fixes go in the .astro components and the base layout, then
      rebuild and redeploy. HTTP headers belong on the CDN or the server that
      serves the build.
  nextjs:
    hint: Work in app/layout or _document, and in the headers section of next.config.
  hugo:
    hint: Edit the layouts and partials, then regenerate the site.
  joomla:
    hint: >
      Work on the active template and the modules; many trackers are inserted by
      third-party extensions.
  drupal:
    hint: Work on the theme and the enabled modules.
  shopify:
    hint: >
      Hosted platform: some transfers cannot be removed and have to be declared;
      additional tags are removed from the theme or from the installed apps.
  wix:
    hint: >
      Closed hosted platform: technical room for manoeuvre is limited, so the
      notice has to declare the provider and its processing.
  squarespace:
    hint: "Hosted platform: work from Settings → Cookies & Visitor Data."
  opencity-italia:
    hint: >
      Open-source platform for Italian public bodies: the fix should go upstream
      to the platform supplier, so every body using it is fixed at once.
  municipium:
    hint: "Platform for Italian public bodies supplied by Maggioli: open a ticket with the supplier."

