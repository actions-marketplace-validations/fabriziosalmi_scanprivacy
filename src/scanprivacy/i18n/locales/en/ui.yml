cookie_policy:
  cookie_list: List of cookies with names and lifetimes
  how_to_withdraw: Instructions to disable them and withdraw consent

diff:
  vantage_changed: >
    These two scans were made from different places ({before} -> {after}). A site
    does not answer every observer the same way: consent banners are geo-gated,
    CDNs reply from different edges, and some hosts serve nothing outside their
    market. Part of what appears below may be the observer changing rather than
    the site. Re-scan from the earlier vantage point before reading it as
    remediation or as a regression.
  vantage_unknown: >
    At least one of these scans does not record where it was made from, so the
    two cannot be shown to have observed the site from the same place. Set
    SCANPRIVACY_VANTAGE on future runs if this comparison matters.
  configuration_changed: >
    These two scans were produced by different engine configurations ({changed}
    differ). Part of what appears below describes the change in the engine, not
    a change on the site: a finding a rule no longer produces is listed as
    resolved, and nobody fixed anything. Re-scan the earlier state with the
    current engine before reading this as remediation.
  configuration_unknown: >
    One of these scans does not record which engine configuration produced it,
    so the two cannot be shown to be the same analysis. Read the comparison as
    indicative rather than as measurement.
  note: >
    A "resolved" finding means it is no longer observable with the same method,
    not that its cause was removed: a tracker present only on other pages
    disappears from this comparison while remaining active.

page_choice:
  entry: the page that was submitted
  first_of_kind: "first {kind} page found"
  deep: a deep page — articles carry embeds a landing page never shows
  navigation: main navigation
  robots_skip: "not visited: disallowed by robots.txt"
  other_host: >
    not visited: same organisation, different site. A separate deployment
    needs a separate scan — findings from it, reported here, would name the
    wrong host and send you to the wrong codebase.

page_kind:
  entry: entry page
  contact: contact
  form: form
  services: services
  about: about
  content: article
  account: account
  search: search
  other: other

consent_pass:
  verification:
    field_verified: >
      field-verified — this exact call has been exercised against a real
      installation of the platform and observed to do what the vendor describes.
    documented: >
      documented only — transcribed from the vendor's documentation and never
      run against a live installation. The call may exist, return cleanly and
      do nothing, which from outside the page is indistinguishable from a site
      that ignored the refusal. Findings from this pass are stated as
      indications rather than as facts.
  title: Refusal pass — {domain}
  document_title: "Refusal pass — {domain}"
  description: >
    What {domain} does after the visitor refuses consent, measured through the
    refusal path the consent platform's own vendor documents.
  intro: >
    This is a separate assessment with a separate method. The standard report
    observes a visitor who has not decided and never touches the page. This one
    exercises the refusal the site itself offers, reloads, and compares. The two
    answer different questions and are deliberately not mixed.
  outcome:
    refused: refusal performed through the documented path
    no_consent_mechanism: no consent mechanism detected, nothing to refuse
    platform_not_recognised: consent mechanism present, no documented refusal path known for it
    platform_not_ready: consent platform detected but its interface was not ready
    control_ambiguous: the documented control matched more than one element, so nothing was clicked
    refusal_failed: the documented refusal path was attempted and did not complete
  summary:
    honoured: >
      After the refusal and a fresh page load, no service requiring consent was
      contacted and no tracking identifier remained on the device.
    survived: >
      After the refusal and a fresh page load, {vendors} services requiring
      consent were still contacted and {tracking} tracking identifiers were still
      present on the device.
  footer: "scanprivacy · refusal pass · not legal advice"
  labels:
    third_parties_after: Third parties contacted after the refusal
    cookies_after: Cookies present after the refusal
    storage_after: Terminal storage keys after the refusal
    platform: Consent platform
    method: Method
    action: Exactly what was executed
    documentation: Vendor documentation
    verification: How far this path is proven
    outcome: Outcome
    markers: Markers detected
    before: Before refusal
    after: After refusal
    survived: Still present after refusal
  posture:
    method_refusal: >
      the page is loaded, the consent mechanism is refused through the path its
      own vendor documents, the page is loaded again, and the two observations
      are compared
    interaction_refusal: >
      exactly one action: the documented refusal call or a click on the single
      control the vendor publishes. No other click, no form submitted, no
      navigation, no retry with a different method
    platform_limit: >
      only consent platforms listed in the engine's catalogue, identified by
      their own readiness check. An unrecognised platform is reported as such
      and left untouched
    meaning: >
      a refusal expressed by an automated agent measures the technical behaviour
      of the mechanism; it is not the exercise of a data subject's will

fleet:
  footer: "scanprivacy · fleet assessment · not legal advice"
  quick_wins: "{n} findings across the estate are low-effort fixes on serious findings."
  posture:
    courtesy: >
      every target shares one courtesy budget per host: dozens of sites behind one
      hosting provider must not add up to a load test
  limits:
    aggregate: >
      An aggregate says how often something recurs, never how serious it is for a
      given site: a finding repeated on forty sites may be one template to fix, and
      a finding on one site may be the one that matters. The per-site reports remain
      the document of record.
  title: Fleet privacy assessment
  headline: >
    {scanned} of {targets} targets observed ({failed} unreachable). {actionable} carry a finding above informational, {affected} carry at least one of any kind, {clean} carry none.
  headings:
    repeated: What is repeated across the estate
    vendors: Third parties, by how many sites use them
    targets: Every target
    clean: Sites with no findings
  labels:
    courtesy: Courtesy
    grade: Grade
    sites: Sites
    site: Site
    examples: Examples
    undeclared_on: Undeclared on
    pages: Pages
  legend:
    grades: >
      One grade per site, on the fail-closed scale: F with any critical finding, D with any high, C medium, B low, A clean.
    repeated: >
      Ranked by the number of sites affected, never by the number of findings:
      the same font CDN on thirty sites is one decision taken once and repeated,
      not thirty problems. Fixing it where it is made fixes all of them.
    vendors: >
      A third party used across the estate belongs in one processor register
      entry and one contract, not in thirty separate conversations.

dpia:
  heading: Impact assessment screening
  transfers_heading: Transfers to assess
  legend: >
    A screening, never a determination. It counts the criteria visible from
    outside and names the ones that are not: a report that presented itself as
    complete would let someone conclude "no assessment needed" from evidence that
    never covered the question.
  transfers_legend: >
    For every recipient outside the EEA, the questions a transfer impact
    assessment has to answer, pre-filled with what was observed. Where the
    knowledge base holds an equivalent, it is listed: the cheapest transfer
    impact assessment is the transfer you do not make.
  met: Met on the observable surface
  not_assessable: Not assessable from outside — to be answered by the controller
  threshold: Two or more criteria met usually calls for an assessment.
  labels:
    criterion: Criterion
    state: State
    evidence: What was observed
    recipient: Recipient
    country: Country
    basis: Transfer basis
    data: Data disclosed
    declared: Declared
    alternatives: Equivalents that would remove the transfer
    questions: Questions the assessment must answer
  questions:
    - Which entity actually receives the data, and in which country is it established?
    - On what basis does the transfer rest, and is a copy of the instrument available?
    - >
      Is the recipient subject to legislation permitting public authority access
      beyond what EU law would allow?
    - What supplementary measures apply — encryption, pseudonymisation, contractual and organisational?
    - Is the transfer necessary at all, or is an equivalent available inside the EEA?
  criteria:
    evaluation_scoring: Evaluation or scoring, including profiling
    automated_decision: Automated decision-making with legal or similarly significant effect
    systematic_monitoring: Systematic monitoring of data subjects
    sensitive_data: Special categories, or data of a highly personal nature
    large_scale: Processing on a large scale
    matching_combining: Matching or combining datasets
    vulnerable_subjects: Data concerning vulnerable data subjects
    innovative_technology: Innovative use of new technology
    prevents_rights: Processing that prevents data subjects from exercising a right or using a service
