remediation:
  constraint:
    github-pages: >
      Not fixable on GitHub Pages: the platform serves a fixed set of response
      headers and offers no way to add one. Either put a CDN or reverse proxy in
      front of the site that can set headers (Cloudflare, Fastly, a Caddy or
      nginx instance), or move the hosting somewhere that lets you configure
      them. Everything below applies once you are somewhere a header can be set.
  depends_on_vendor: >
    The fix depends on which third party triggered this finding: each vendor in
    the knowledge base names the pattern that applies to it.
  depends_on_vendor_step: >
    Look up the vendor — `scanprivacy remediation <vendor-id>` — or one of the patterns
    it may name: {patterns}.
  unknown_third_party: Unidentified third party
  transfer_basis:
    dpf: EU–US Data Privacy Framework
    scc: Standard Contractual Clauses
    dpf_scc: EU–US Data Privacy Framework / Standard Contractual Clauses
    adequacy: adequacy decision
  pattern:
    self_host_asset:
      summary: Serve the asset from your own domain and drop the call to {product}.
      steps:
        - Download the file at the version currently in use and serve it from your own domain.
        - Remove every reference to {hosts} from templates and stylesheets.
        - Re-check in a clean window that the page no longer contacts {product} on load.
    replace_with_eu_alternative:
      summary: Replace {product} with an equivalent that does not export data, or gate it behind consent.
      steps:
        - Establish what {product} is actually used for, and whether a lighter tool covers it.
        - Adopt one of the alternatives below, self-hosted or processed within the EEA.
        - If {product} has to stay, load it only after explicit consent and declare the transfer in the notice.
    remove_or_consent_gate:
      summary: Remove {product}, or load it only after explicit consent.
      steps:
        - >
          Establish whether {product} still serves an active purpose; if it does
          not, removing it closes the finding permanently.
        - >
          If it stays, make the script conditional on consent — the request must
          not leave the browser before the user chooses.
        - Declare {vendor} among the recipients in the privacy notice, with purpose and transfer.
    click_to_load:
      summary: Replace the embed with a local preview that loads {product} only when the user asks for it.
      steps:
        - Replace the iframe or widget with a static preview served from your own domain.
        - Load the third-party component only on an explicit click, and say what will happen.
        - "Declare {vendor} in the notice: once loaded, the component receives the visitor's data."
    declare_processor:
      summary: "Necessary provider: nothing to remove, but it has to be declared."
      steps:
        - List {vendor} among the processors in the privacy notice, with the purpose it serves.
        - State the transfer ({transfer}) and the basis relied on, and keep a copy available.
        - Confirm the processing agreement under Art. 28 is signed and current.
    scope_to_page:
      summary: Load {product} only on the pages that actually need it.
      steps:
        - Remove {product} from the global layout; include it only where the function is used.
        - Declare {vendor} in the notice, together with the purpose it serves.
    verify_prior_blocking:
      summary: "Consent platform: technical by nature, but it has to actually block."
      steps:
        - Enable automatic prior blocking in the platform's configuration.
        - Verify in a clean window that no third-party request leaves before a choice is made.
        - "Declare {vendor} in the notice: it processes the proof of consent."
    session_replay:
      summary: "Session recording: explicit prior consent, or removal."
      steps:
        - Remove {product} if the recordings are not being used for a defined purpose.
        - "If it stays: explicit prior consent, automatic masking of input fields, a stated retention period."
        - Declare {vendor} in the notice, stating what a recording contains.
    identify_unknown:
      summary: Identify what {product} is, decide whether it is needed, and declare it if it stays.
      steps:
        - Establish which component of the site loads {hosts} and what purpose it serves.
        - If it is not needed, remove it; if it is, self-host the asset where possible.
        - If the service stays, sign the processing agreement and list it among the recipients in the notice.
  extra:
    badges_are_fetched_per_view: >
      A badge is fetched on every page view, not once: a README with ten of them
      discloses the visitor to the badge service ten times. The image is static —
      caching it at build time removes the transfer without changing the page.
    idp_receives_identity: >
      An identity provider receives who the user is, not merely that a visitor arrived: state the categories of identity attributes it receives, and for how long authentication events are kept.
    remove_font_link: Remove every <link rel="preconnect"/"stylesheet"> pointing at {hosts}.
    remove_gtag: Remove gtag.js and the measurement tag from the template.
    audit_container: Take stock of the tags actually active in the container before deciding.
    consent_mode_not_enough: >
      Consent Mode is not sufficient on its own: the request to the tag manager
      leaves the browser regardless.
    assess_spam_volume: >
      Measure the actual volume of spam first: a honeypot plus rate limiting is
      often enough, and it profiles nobody.
    nocookie_is_not_enough: >
      The youtube-nocookie domain reduces the cookies set but does not remove the
      transfer of the visitor's IP address.
    no_cookie_wall: Access to the content must not depend on accepting advertising.
    check_request_path: >
      Check the path of the request (recaptcha, fonts, ads, …) and apply the fix
      for that specific service.
    record_in_ropa: Record the processing in the register of processing activities.
    verify_transfer_chain: Verify the whole transfer chain, including onward transfers by the provider.
    enable_masking: Enable automatic suppression of sensitive fields in the recordings.
    matomo_consent_exempt_config: >
      Configure it to be consent-exempt: IP anonymisation of at least two bytes,
      cookieless tracking, Do Not Track honoured.
    prefer_self_hosted: Prefer the self-hosted instance over the cloud service.
    map_subprocessors: Map the chain of sub-processors and keep it in the register.
    no_adequacy_decision: >
      The destination country has no adequacy decision: removal is the safe
      option; anything else requires a transfer impact assessment.
    wordpress_disable_avatars: "In WordPress: Settings → Discussion → disable avatars, or use a local avatar plugin."
    jetpack_disable_stats: >
      Disable the Jetpack Stats module and the Site Accelerator, which also routes
      images through wp.com.
    vimeo_dnt: Add the dnt=1 parameter to the embed.
    declare_antifraud: Declare the anti-fraud purpose and the transfer in the notice.
    separate_form_from_tracking: Separate the form itself (necessary) from the tracking code (optional).
    verify_dpa: Verify the processing agreement is signed and covers the current processing.
    cmp_is_also_a_transfer: >
      The consent platform is itself a transfer outside the EEA and has to be
      declared like any other recipient.
    prefer_eu_region: Choose an EU region for processing where the provider offers one.
    asset_from_widget: >
      If the asset comes from an embedded widget, the fix belongs to the widget:
      remove it or load it on click.
