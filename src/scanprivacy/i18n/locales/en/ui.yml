  rule_error_note: "Some rules could not be evaluated, so this outcome is not a favourable one."
  rule_error_blocking: "a rule could not be evaluated — the findings below may be incomplete"
  robots_skip: the site's robots.txt does not allow the declared user agent to read this URL

