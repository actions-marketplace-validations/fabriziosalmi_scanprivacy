  transfers: Transfers to third countries (Art. 13(1)(f))
  retention: Retention period (Art. 13(2)(a))
  rights: Rights of the data subject (Art. 13(2)(b) — Arts. 15-22)
  complaint: Right to lodge a complaint with the supervisory authority (Art. 13(2)(d))
  profiling: Automated decision-making and profiling (Art. 13(2)(f))
  last_updated: Date the document was last updated

discovery:
  linked: linked from the page
  conventional_path: a conventional path
