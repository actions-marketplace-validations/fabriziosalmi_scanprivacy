  legend:
    requests_entry_only: >
      The table below lists the requests of the entry page ({url}); the other pages are counted in the table above and detailed in the attached JSON.
    pages: >
      Pages are chosen deterministically — one per kind, then a leaf page, then the main navigation — so two scans of the same site remain comparable. Links are followed from the entry page only: a conformance check is not a crawl.
    severity_priority: >
      <strong>Severity</strong> is how much the finding weighs in legal terms.
      <strong>Priority</strong> is the order in which to deal with it — severity
      corrected for the effort required, so that a high finding fixable in ten
      minutes comes before one that needs a supplier negotiation. P1 is the most
      urgent, P5 the least.
    owner: >
      The owner is whoever holds the technical or organisational lever to close
      the finding, not whoever is legally accountable for the processing.
    inventory: >
      Third parties that received data when the page loaded, in the shape a
      record of processing activities (Art. 30 GDPR) and a supplier register
      need them. "Declared" says whether the party is named in the legal
      documents that were read.
    requests: >
      No user interaction took place. Time is measured from the start of
      navigation: a request at t = 200 ms cannot follow a consent the user never
      gave.
    headers: >
      Values are reproduced in full: they are evidence, and a truncated value
      cannot be verified.
    documents_attempted: >
      Listed because they are part of the evidence: they show where the document
      was looked for before concluding it is not reachable.
    rule_digests: >
      Appendix: lets a reader establish whether a rule changed between two
      scans, and which one.
    negated_vendors: >
      Mentioned only in the negative ("we do not use…"): this does not count as
      declaring a recipient.
    reproducibility: >
      This document can be derived again from scratch. The configuration
      digests identify the rules and knowledge base that were applied: same
      digests and same target means the same analysis was applied. The evidence
      digest ties the report to the observation attached to it; it is not stable
      across runs, because sites change — which is exactly what makes it possible
      to prove that they did.
    quick_wins: >
      <strong>{n} low-effort fixes on high or critical findings.</strong> These
      come first: {ids}.
    truncated_requests: >
      Showing {shown} of {total} requests; the complete list, with full URLs, is
      in the attached JSON.
    more_items: "(+{n} in the attached JSON)"
    no_documents_read: "No legal document was read: see the list of attempts below."
    no_third_parties: No third party was contacted on load.
    no_cookies: No cookie was set on first visit.
    no_storage: No write to terminal storage was observed.
    unusable_document: reachable but not recognisable as a "{kind}" document

  summary:
    third_parties: >
      On loading the page, with no interaction from the user, the site contacted
      <strong>{n} third parties</strong>
    third_parties_transfers: ", {n} of which process data outside the European Economic Area"
    third_parties_transfers_all: ", all of which process data outside the European Economic Area"
    third_parties_undeclared: "; <strong>{n} are not named</strong> in the published legal documents"
    third_parties_none: >
      No request to any third party was observed when the page loaded: the site
      serves everything from its own domain.
    storage_intro: Before any choice by the user the site has already set
    cookies:
      one: 1 cookie
      other: "{n} cookies"
    storage_keys:
      one: 1 terminal storage key
      other: "{n} terminal storage keys"
    storage_join: " and "
    storage_tracking:
      one: ", 1 of which is attributable to tracking"
      other: ", {n} of which are attributable to tracking"
    storage_none: No cookie and no write to the terminal on first visit.
    consent_missing: >
      {n} of the services observed require prior consent, but no mechanism to
      collect it was detected on the page.
    consent_present: "A consent mechanism is present ({names})."
    verdict: >
      The overall outcome is <strong>{grade}</strong>: {total} findings, of which
      {critical} critical and {high} high
    verdict_quick: "; {n} can be closed with a low-effort fix"

  posture_label:
    method: Method
    pages: Pages
    interaction: Interaction
    consent: Consent
    extra_requests: Extra requests
    intrusive_tests: Intrusive tests
    robots: robots.txt
    user_agent: User-Agent
  posture:
    pages:
      one: only the page submitted, one page load per second per host
      other: >
        at most {n} pages of the same site, chosen deterministically, one page
        load per second per host
    method: only the public page indicated is loaded, with a headless browser
    interaction: none — no clicks, no form submissions, no authentication
    consent: >
      no choice is expressed: what the site does to a visitor who has not yet
      decided is what gets observed
    extra_requests: only the legal documents linked from the page, one per kind
    intrusive_tests: none — no fuzzing, no enumeration, no access to restricted areas
    robots: honoured for every URL the engine requests
    user_agent: "{ua}"

  limits:
    partial: >
      Part of the observation did not complete: {probes}. What those reads would
      have found is unknown, and this report does not treat it as absent. Repeat
      the scan before drawing a conclusion from a silence in those areas.
    title: Stated limits.
    body: >
      The observation covers a single page and a single visit: tools present
      elsewhere do not show up, and two consecutive loads may differ. No consent
      was expressed, so behaviour after acceptance is not verified. Art. 13
      elements are recognised from the text: an unusual wording can escape
      detection, which is why documentary findings carry "indicated" confidence.
      The mapping to ISO, NIS2 and SOC 2 orients the work and does not attest
      conformity to those schemes.
    disclaimer: >
      Assessment carried out by observing only the traffic generated by the
      browser when loading public pages, with ordinarily available tools.
      Independent technical research conducted in good faith: it is not legal
      advice nor professional data protection consultancy.

verification:
  clean_window: >
    Open a private browsing window (no pre-existing cookies, no extensions) and
    the developer tools on the Network tab, with "preserve log" ticked.
  closing: >
    Every check must be done in a clean window: a pre-existing cookie or consent
    changes what the site does and makes the comparison meaningless.
  vendor_request:
    - "{clean_window}"
    - "Load {url} and do **not** interact with the page."
    - "Filter requests by `{host}`: the request appears before any click."
  vendor_request_sample: "Request observed during this assessment: `{url}`"
  vendor_request_cli: >
    From the command line the same fact shows up with: `curl -s {url} | grep -o {host} | sort -u` (this catches static inclusions; anything injected by a script is only visible on the Network tab).
  vendor_header:
    - "Run: `curl -sSI {url}` and read the response headers."
    - >
      The header that identifies the provider is reported in the evidence
      (`server`, `cf-ray`, `x-github-request-id`, …).
    - Compare with the list of processors in the privacy notice.
  vendor_document: "Check whether the provider is named in {url} (text search in the page)."
  cookie:
    - "{clean_window}"
    - "Load {url} without interacting."
    - "Developer tools → Application → Cookies → `{domain}`: the cookie «{name}» is already there."
    - "Alternatively, the headers: `curl -sSI {url} | grep -i set-cookie`."
  storage:
    - "{clean_window}"
    - "Load {url} without interacting."
    - "Developer tools → Application → {kind} → the key «{key}» is already written."
    - "Or in the console: `Object.keys(localStorage)` and `Object.keys(sessionStorage)`."
  form:
    - "Open {url} and inspect the `<form>` element indicated in the evidence."
    - "Its `action` attribute points to `{action}`."
    - >
      No submission was made during the observation: the finding concerns the
      destination the form declares.
  headers:
    - "Run: `curl -sSI {url}`."
    - >
      Compare the headers present with those the finding expects (the complete
      list of observed headers is in the evidence).
  tls:
    - >
      Run: `openssl s_client -connect {host}:443 -servername {host} </dev/null 2>/dev/null |
      openssl x509 -noout -issuer -dates -fingerprint -sha256`.
    - Compare issuer and fingerprint with those in the TLS section of the evidence.
  documents_found:
    - "Open {url} and look in the text for the elements listed as missing."
    - >
      The document was read in full: the "legal documents" section reports its
      URL, length and the SHA-256 digest of the extracted text, so the same
      version can be compared.
  documents_missing:
    - "Look for a link to the privacy notice in {url}, footer included."
    - >
      Try the conventional paths: /privacy, /privacy-policy, /cookie-policy. The
      list of paths attempted and their outcome is in the documents section of
      the evidence.
  consent:
    - "{clean_window}"
    - >
      Load {url}: observe whether a choice mechanism appears and, at the same
      time, which cookies and storage keys are already present before any choice.
    - >
      In the console: `typeof window.__tcfapi` — if it returns `undefined`, the
      standard consent API is not exposed.
  ai:
    - "Open {url} and look for a visible notice about the automated nature of the component."
    - Check the privacy notice for a section on the use of AI systems.

