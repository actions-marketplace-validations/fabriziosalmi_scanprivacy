# Aliases: the strings searched in a site's OWN privacy notice to decide whether
# a vendor is actually declared. They are language-specific by nature — a notice
# written in Italian names things the way Italian does — and the engine matches
# against the union of every locale, because the language of the notice is not
# known in advance.
#
# Word-boundary matching applies: an alias must be specific enough that it
# cannot fire on ordinary prose. "meta" matched "metà" once; that is the bar.
