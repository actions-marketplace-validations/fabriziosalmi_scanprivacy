remediation:
  constraint:
    github-pages: >
      Non risolvibile su GitHub Pages: la piattaforma invia un insieme fisso di
      header di risposta e non permette di aggiungerne. Le due strade sono
      anteporre al sito una CDN o un reverse proxy in grado di impostare gli
      header (Cloudflare, Fastly, un'istanza Caddy o nginx), oppure spostare
      l'hosting dove gli header siano configurabili. Quanto segue vale una volta
      che ci si trova dove un header si può impostare.
  depends_on_vendor: >
    La correzione dipende da quale terza parte ha generato il rilievo: ogni
    fornitore nella knowledge base indica il pattern che gli si applica.
  depends_on_vendor_step: >
    Consultare il fornitore — `scanprivacy remediation <vendor-id>` — o uno dei pattern
    che può indicare: {patterns}.
  unknown_third_party: Terza parte non identificata
  transfer_basis:
    dpf: EU–US Data Privacy Framework
    scc: Clausole contrattuali standard
    dpf_scc: EU–US Data Privacy Framework / clausole contrattuali standard
    adequacy: decisione di adeguatezza
  pattern:
    self_host_asset:
      summary: Servire la risorsa dal proprio dominio ed eliminare la chiamata a {product}.
      steps:
        - Scaricare il file alla versione in uso e servirlo dal proprio dominio.
        - Rimuovere ogni riferimento a {hosts} da template e fogli di stile.
        - Riverificare in finestra pulita che la pagina non contatti più {product} al caricamento.
    replace_with_eu_alternative:
      summary: Sostituire {product} con uno strumento equivalente che non esporti dati, oppure subordinarlo al consenso.
      steps:
        - Stabilire a cosa serve davvero {product} e se uno strumento più leggero copre la stessa esigenza.
        - Adottare una delle alternative indicate, self-hosted o con trattamento nel SEE.
        - Se {product} deve restare, caricarlo solo dopo consenso esplicito e dichiarare il trasferimento in informativa.
    remove_or_consent_gate:
      summary: Rimuovere {product}, oppure caricarlo solo dopo consenso esplicito.
      steps:
        - >
          Stabilire se {product} risponde ancora a una finalità attiva; se non è
          così, rimuoverlo chiude il rilievo in modo definitivo.
        - >
          Se resta, condizionare lo script al consenso: la richiesta non deve
          partire prima che l'utente abbia scelto.
        - Dichiarare {vendor} fra i destinatari nell'informativa, con finalità e trasferimento.
    click_to_load:
      summary: Sostituire l'embed con un'anteprima locale che carica {product} solo su richiesta dell'utente.
      steps:
        - Sostituire l'iframe o il widget con un'anteprima statica servita dal proprio dominio.
        - Caricare il componente di terza parte solo su click esplicito, dicendo cosa accadrà.
        - "Dichiarare {vendor} in informativa: una volta caricato, il componente riceve i dati del visitatore."
    declare_processor:
      summary: "Fornitore necessario: non c'è nulla da rimuovere, ma va dichiarato."
      steps:
        - Indicare {vendor} fra i responsabili nell'informativa, con la finalità che assolve.
        - Indicare il trasferimento ({transfer}) e la base su cui si fonda, tenendone copia disponibile.
        - Verificare che l'accordo ex art. 28 sia firmato e aggiornato.
    scope_to_page:
      summary: Caricare {product} solo sulle pagine che ne hanno davvero bisogno.
      steps:
        - Rimuovere {product} dal layout globale e includerlo solo dove la funzione serve.
        - Dichiarare {vendor} in informativa, insieme alla finalità.
    verify_prior_blocking:
      summary: "Piattaforma di consenso: tecnica per natura, ma deve bloccare davvero."
      steps:
        - Attivare il blocco preventivo automatico nella configurazione della piattaforma.
        - Verificare in finestra pulita che nessuna richiesta a terzi parta prima della scelta.
        - "Dichiarare {vendor} in informativa: tratta la prova del consenso."
    session_replay:
      summary: "Registrazione della sessione: consenso esplicito preventivo, oppure rimozione."
      steps:
        - Rimuovere {product} se le registrazioni non sono usate per una finalità definita.
        - "Se resta: consenso esplicito preventivo, mascheramento automatico dei campi, periodo di conservazione dichiarato."
        - Dichiarare {vendor} in informativa, indicando cosa contiene una registrazione.
    identify_unknown:
      summary: Identificare cosa sia {product}, decidere se serve e dichiararlo se resta.
      steps:
        - Stabilire quale componente del sito carica {hosts} e a quale finalità risponde.
        - Se non è necessario, rimuoverlo; se lo è, self-hostare la risorsa quando possibile.
        - Se il servizio resta, firmare l'accordo ex art. 28 e citarlo fra i destinatari nell'informativa.
  extra:
    badges_are_fetched_per_view: >
      Un badge viene scaricato a ogni visualizzazione, non una volta sola: un README
      con dieci badge espone il visitatore al servizio dieci volte. L'immagine è
      statica: metterla in cache in fase di build elimina il trasferimento senza
      cambiare la pagina.
    idp_receives_identity: >
      Un provider di identità riceve chi è l'utente, non soltanto che un visitatore è arrivato: indicare le categorie di attributi di identità che riceve e per quanto tempo sono conservati gli eventi di autenticazione.
    remove_font_link: Rimuovere ogni <link rel="preconnect"/"stylesheet"> verso {hosts}.
    remove_gtag: Rimuovere gtag.js e il tag di misurazione dal template.
    audit_container: Censire i tag effettivamente attivi nel container prima di decidere.
    consent_mode_not_enough: >
      Il Consent Mode da solo non basta: la richiesta verso il tag manager parte
      comunque.
    assess_spam_volume: >
      Misurare prima il volume reale di spam: spesso un honeypot con rate limiting
      è sufficiente, e non profila nessuno.
    nocookie_is_not_enough: >
      Il dominio youtube-nocookie riduce i cookie impostati ma non elimina il
      trasferimento dell'indirizzo IP del visitatore.
    no_cookie_wall: L'accesso al contenuto non deve dipendere dall'accettazione della pubblicità.
    check_request_path: >
      Verificare il path della richiesta (recaptcha, fonts, ads, …) e applicare la
      correzione specifica di quel servizio.
    record_in_ropa: Riportare il trattamento nel registro delle attività di trattamento.
    verify_transfer_chain: Verificare l'intera catena di trasferimento, inclusi i trasferimenti successivi del fornitore.
    enable_masking: Attivare la soppressione automatica dei campi sensibili nelle registrazioni.
    matomo_consent_exempt_config: >
      Configurarlo in modo esente da consenso: anonimizzazione IP di almeno due
      byte, tracciamento senza cookie, Do Not Track rispettato.
    prefer_self_hosted: Preferire l'istanza self-hosted al servizio cloud.
    map_subprocessors: Mappare la catena dei sub-responsabili e mantenerla nel registro.
    no_adequacy_decision: >
      Il paese di destinazione non ha una decisione di adeguatezza: la rimozione è
      l'opzione sicura; qualunque altra richiede una valutazione d'impatto sul
      trasferimento.
    wordpress_disable_avatars: "In WordPress: Impostazioni → Discussione → disattivare gli avatar, oppure plugin di avatar locali."
    jetpack_disable_stats: >
      Disattivare il modulo Jetpack Stats e il Site Accelerator, che instrada
      anche le immagini attraverso wp.com.
    vimeo_dnt: Aggiungere il parametro dnt=1 all'embed.
    declare_antifraud: Dichiarare in informativa la finalità antifrode e il trasferimento.
    separate_form_from_tracking: Separare il modulo in sé (necessario) dal codice di tracciamento (facoltativo).
    verify_dpa: Verificare che l'accordo sul trattamento sia firmato e copra il trattamento in corso.
    cmp_is_also_a_transfer: >
      La piattaforma di consenso è essa stessa un trasferimento fuori dal SEE e va
      dichiarata come ogni altro destinatario.
    prefer_eu_region: Scegliere una regione UE per il trattamento, dove il fornitore la offre.
    asset_from_widget: >
      Se la risorsa proviene da un widget incorporato, la correzione riguarda il
      widget: rimuoverlo o caricarlo al click.
  alternative:
    link_out_to_channel: un collegamento al canale, aperto solo se il visitatore lo sceglie
    cached_badge_svg: l'SVG del badge, scaricato una volta in fase di build e servito dal proprio dominio
    fontsource: Fontsource (self-hosted via npm)
    system_fonts: caratteri di sistema
    matomo_self_hosted: Matomo (self-hosted)
    umami_self_hosted: Umami (self-hosted)
    plausible_eu: Plausible (UE)
    cloudflare_web_analytics: Cloudflare Web Analytics
    web_analytics_italia: Web Analytics Italia (per le PA)
    turnstile: Cloudflare Turnstile
