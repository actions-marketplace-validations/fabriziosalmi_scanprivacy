  legend:
    requests_entry_only: >
      La tabella seguente elenca le richieste della pagina di ingresso ({url}); le altre pagine sono conteggiate nella tabella qui sopra e dettagliate nel JSON allegato.
    pages: >
      Le pagine sono scelte in modo deterministico — una per tipo, poi una pagina profonda, poi la navigazione principale — così due scansioni dello stesso sito restano confrontabili. I link si seguono solo dalla pagina di ingresso: una verifica di conformità non è un crawl.
    severity_priority: >
      <strong>Gravità</strong>: quanto pesa il rilievo sul piano normativo.
      <strong>Priorità</strong>: in quale ordine conviene affrontarlo — è la
      gravità corretta per l'impegno richiesto, così che un rilievo alto
      risolvibile in dieci minuti venga prima di uno che richiede una trattativa
      con un fornitore. P1 è il più urgente, P5 il meno.
    owner: >
      Il responsabile indicato è chi ha la leva tecnica o organizzativa per
      chiudere il rilievo, non chi risponde giuridicamente del trattamento.
    inventory: >
      Soggetti terzi che hanno ricevuto dati al caricamento della pagina, nella
      forma utile a compilare o riconciliare il registro dei trattamenti
      (art. 30 GDPR) e il registro dei fornitori. «Dichiarato» indica se il
      soggetto è nominato nei documenti legali letti.
    requests: >
      Nessuna interazione dell'utente. Il tempo è misurato dall'avvio della
      navigazione: una richiesta a t = 200 ms non può seguire un consenso che
      l'utente non ha prestato.
    headers: >
      Valori riportati per esteso: sono evidenza, e un valore troncato non è
      verificabile.
    documents_attempted: >
      Elencati perché fanno parte dell'evidenza: dicono dove il documento è
      stato cercato prima di concludere che non è raggiungibile.
    rule_digests: >
      Appendice: consente di stabilire se una regola è cambiata fra due
      scansioni, e quale.
    negated_vendors: >
      Citati solo in forma negativa («non utilizziamo…»): non contano come
      dichiarazione di un destinatario.
    reproducibility: >
      Questo documento è ricavabile daccapo. Le impronte di configurazione
      identificano regole e knowledge base applicate: a parità di impronte e di
      obiettivo, l'analisi applicata è la stessa. L'impronta dell'evidenza lega
      il report all'osservazione allegata; non è stabile fra esecuzioni, perché
      i siti cambiano — ed è esattamente ciò che consente di dimostrare che sono
      cambiati.
    quick_wins: >
      <strong>{n} interventi a impegno basso su rilievi di gravità alta o
      critica.</strong> Sono i primi da fare: {ids}.
    truncated_requests: >
      Mostrate {shown} richieste su {total}; l'elenco completo, con gli URL per
      esteso, è nel JSON allegato.
    more_items: "(+{n} nell'allegato JSON)"
    no_documents_read: "Nessun documento legale è stato letto: si veda l'elenco dei tentativi qui sotto."
    no_third_parties: Nessuna terza parte contattata al caricamento.
    no_cookies: Nessun cookie impostato alla prima visita.
    no_storage: Nessuna scrittura sulla memoria del terminale.
    unusable_document: raggiungibile ma non riconoscibile come documento «{kind}»

  summary:
    third_parties: >
      Al caricamento della pagina, senza alcuna interazione dell'utente, il sito
      ha contattato <strong>{n} soggetti terzi</strong>
    third_parties_transfers: ", di cui {n} trattano dati fuori dallo Spazio Economico Europeo"
    third_parties_transfers_all: ", tutti con trattamento fuori dallo Spazio Economico Europeo"
    third_parties_undeclared: "; <strong>{n} non risultano nominati</strong> nei documenti legali pubblicati"
    third_parties_none: >
      Al caricamento della pagina non è stata osservata alcuna richiesta verso
      soggetti terzi: il sito si serve solo del proprio dominio.
    storage_intro: Prima di qualunque scelta dell'utente il sito ha già impostato
    cookies:
      one: 1 cookie
      other: "{n} cookie"
    storage_keys:
      one: 1 chiave di memoria del terminale
      other: "{n} chiavi di memoria del terminale"
    storage_join: " e "
    storage_tracking:
      one: ", di cui 1 riconducibile a tracciamento"
      other: ", di cui {n} riconducibili a tracciamento"
    storage_none: Nessun cookie e nessuna scrittura sul terminale alla prima visita.
    consent_missing: >
      {n} dei servizi osservati richiedono il consenso preventivo, ma nella
      pagina non è stato rilevato alcun meccanismo per raccoglierlo.
    consent_present: "È presente un meccanismo di consenso ({names})."
    verdict: >
      L'esito complessivo è <strong>{grade}</strong>: {total} rilievi, di cui
      {critical} critici e {high} alti
    verdict_quick: "; {n} si chiudono con un intervento a impegno basso"

  posture_label:
    method: Metodo
    pages: Pagine
    interaction: Interazione
    consent: Consenso
    extra_requests: Richieste aggiuntive
    intrusive_tests: Test intrusivi
    robots: robots.txt
    user_agent: User-Agent
  posture:
    pages:
      one: solo la pagina indicata, un caricamento al secondo per host
      other: >
        al più {n} pagine dello stesso sito, scelte in modo deterministico, un
        caricamento al secondo per host
    method: caricamento della sola pagina pubblica indicata, con browser headless
    interaction: nessuna — nessun click, nessun invio di moduli, nessuna autenticazione
    consent: >
      nessuna scelta espressa: si osserva ciò che il sito fa a un visitatore che
      non ha ancora deciso
    extra_requests: solo i documenti legali collegati dalla pagina, uno per tipo
    intrusive_tests: nessuno — nessun fuzzing, nessuna enumerazione, nessun accesso ad aree riservate
    robots: rispettato per ogni URL richiesto dal motore
    user_agent: "{ua}"

  limits:
    partial: >
      Una parte dell'osservazione non è andata a termine: {probes}. Ciò che
      quelle letture avrebbero trovato non è noto, e questo report non lo tratta
      come assente. Ripetere la scansione prima di trarre conclusioni da un
      silenzio in quelle aree.
    title: Limiti dichiarati.
    body: >
      L'osservazione riguarda una sola pagina e una sola visita: strumenti
      presenti altrove non emergono, e due caricamenti consecutivi possono
      differire. Non è stato espresso alcun consenso, quindi non è verificato il
      comportamento successivo all'accettazione. Il riconoscimento degli
      elementi dell'art. 13 è testuale: una formula inconsueta può sfuggire, per
      questo i rilievi documentali hanno confidenza «indiziaria». La mappatura
      verso ISO, NIS2 e SOC 2 orienta il lavoro e non attesta conformità a quegli
      schemi.
    disclaimer: >
      Verifica condotta osservando esclusivamente il traffico generato dal
      browser al caricamento di pagine pubbliche, con gli strumenti
      ordinariamente disponibili. Ricerca tecnica indipendente, condotta in buona
      fede: non costituisce parere legale né consulenza professionale in materia
      di protezione dei dati.

verification:
  clean_window: >
    Aprire una finestra di navigazione in incognito (nessun cookie pregresso,
    nessuna estensione) e gli strumenti per sviluppatori sulla scheda Rete,
    spuntando «conserva log».
  closing: >
    Ogni verifica va condotta in finestra pulita: un cookie o un consenso
    pregresso cambia ciò che il sito fa e rende il confronto non comparabile.
  vendor_request:
    - "{clean_window}"
    - "Caricare {url} e **non** interagire con la pagina."
    - "Filtrare le richieste per `{host}`: la richiesta compare prima di qualunque click."
  vendor_request_sample: "Richiesta osservata durante questa verifica: `{url}`"
  vendor_request_cli: >
    Da riga di comando lo stesso fatto si ottiene con: `curl -s {url} | grep -o {host} | sort -u` (cattura le inclusioni statiche; quelle iniettate da script si vedono solo nella scheda Rete).
  vendor_header:
    - "Eseguire: `curl -sSI {url}` e leggere gli header di risposta."
    - >
      L'intestazione che identifica il fornitore è riportata nell'evidenza
      (`server`, `cf-ray`, `x-github-request-id`, …).
    - Confrontare con l'elenco dei responsabili del trattamento nell'informativa.
  vendor_document: "Verificare se il fornitore è nominato in {url} (ricerca testuale nella pagina)."
  cookie:
    - "{clean_window}"
    - "Caricare {url} senza interagire."
    - "Strumenti per sviluppatori → Applicazione → Cookie → `{domain}`: il cookie «{name}» è già presente."
    - "In alternativa, gli header: `curl -sSI {url} | grep -i set-cookie`."
  storage:
    - "{clean_window}"
    - "Caricare {url} senza interagire."
    - "Strumenti per sviluppatori → Applicazione → {kind} → la chiave «{key}» è già scritta."
    - "Oppure in console: `Object.keys(localStorage)` e `Object.keys(sessionStorage)`."
  form:
    - "Aprire {url} e ispezionare l'elemento `<form>` indicato nell'evidenza."
    - "L'attributo `action` punta a `{action}`."
    - >
      Nessun invio è stato effettuato durante l'osservazione: il rilievo
      riguarda la destinazione dichiarata dal modulo.
  headers:
    - "Eseguire: `curl -sSI {url}`."
    - >
      Confrontare gli header presenti con quelli attesi dal rilievo (l'elenco
      completo degli header osservati è nell'evidenza).
  tls:
    - >
      Eseguire: `openssl s_client -connect {host}:443 -servername {host} </dev/null 2>/dev/null |
      openssl x509 -noout -issuer -dates -fingerprint -sha256`.
    - Confrontare emittente e impronta con quelli riportati nella sezione TLS dell'evidenza.
  documents_found:
    - "Aprire {url} e cercare nel testo gli elementi elencati come mancanti."
    - >
      Il documento è stato letto integralmente: la sezione «documenti legali» ne
      riporta URL, lunghezza e impronta SHA-256 del testo estratto, così da poter
      confrontare la stessa versione.
  documents_missing:
    - "Cercare un collegamento all'informativa in {url}, footer compreso."
    - >
      Provare i percorsi convenzionali: /privacy, /privacy-policy,
      /cookie-policy. L'elenco dei percorsi tentati e il loro esito sono nella
      sezione documenti dell'evidenza.
  consent:
    - "{clean_window}"
    - >
      Caricare {url}: osservare se compare un meccanismo di scelta e,
      contemporaneamente, quali cookie e chiavi di memoria sono già presenti
      prima di qualunque scelta.
    - >
      In console: `typeof window.__tcfapi` — se restituisce `undefined`, non è
      esposta l'API di consenso standard.
  ai:
    - "Aprire {url} e cercare un avviso visibile sulla natura automatica del componente."
    - Verificare nell'informativa la presenza di una sezione sull'uso di sistemi di IA.

