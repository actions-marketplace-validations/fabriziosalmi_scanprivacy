record:
  vantage:
    label: Punto di osservazione
    not_configured: >
      non registrato. Impostare SCANPRIVACY_VANTAGE per dichiarare da dove è
      stata eseguita la scansione, oppure SCANPRIVACY_VANTAGE_LOOKUP per farlo
      determinare. Nessuno dei due è attivo per impostazione predefinita: un
      motore che chiede a un terzo dove si trova, a ogni scansione, farebbe
      esattamente ciò che questo rapporto serve a rilevare.
    lookup_failed: "la determinazione configurata non è andata a buon fine"
    declared: "dichiarato dall'operatore"
    looked_up: "determinato tramite {endpoint}"
  findings_digest_note: >
    Copre i rilievi così come pubblicati. Il digest dell'evidenza qui sopra
    copre l'osservazione da cui derivano; questo rileva un documento i cui
    rilievi sono stati modificati a posteriori.
  digest_note: A parità di impronte e di obiettivo, l'analisi applicata è la stessa.
  evidence_digest_computed_on: JSON canonico del blocco «observation» (chiavi ordinate, senza spazi)
  evidence_digest_note: >
    Identifica questa osservazione; non è stabile fra esecuzioni, perché i siti
    cambiano. Serve a legare il report all'evidenza allegata e a rilevare
    modifiche successive.
  rerun:
    - pip install -e . && python -m playwright install chromium
    - "scanprivacy scan {url} --json evidenza.json --md report.md --pdf report.pdf"
    - "scanprivacy verify evidenza.json   # ricalcola tutte le impronte di questa sezione"
    - >
      Ogni singolo rilievo riporta inoltre i passi per verificarlo con un
      browser e curl, senza questo strumento.
  parameters:
    user_agent: user agent
    wait_after_domcontentloaded_ms: attesa dopo DOMContentLoaded (ms)
    navigation_timeout_ms: timeout di navigazione (ms)
    scan_budget_s: budget per scansione (s)
    robots_respected: robots.txt rispettato
    max_documents: documenti massimi letti
    max_requests_recorded: richieste registrate massime
  engine:
