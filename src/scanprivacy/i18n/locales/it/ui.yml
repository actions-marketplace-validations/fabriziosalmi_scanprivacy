diff:
  vantage_changed: >
    Le due scansioni sono state effettuate da luoghi diversi ({before} -> {after}).
    Un sito non risponde allo stesso modo a ogni osservatore: i banner di consenso
    sono geolocalizzati, le CDN rispondono da edge diversi e alcuni host non
    servono nulla fuori dal proprio mercato. Parte di quanto segue può essere
    l'osservatore che è cambiato, non il sito. Rieseguire la scansione dallo
    stesso punto di osservazione prima di leggerla come remediation o come
    regressione.
  vantage_unknown: >
    Almeno una delle due scansioni non registra da dove è stata effettuata, quindi
    non si può dimostrare che abbiano osservato il sito dallo stesso luogo. Se il
    confronto conta, impostare SCANPRIVACY_VANTAGE nelle prossime esecuzioni.
  configuration_changed: >
    Le due scansioni sono state prodotte da configurazioni diverse del motore
    ({changed} differiscono). Parte di quanto segue descrive la modifica al
    motore, non un cambiamento sul sito: un rilievo che una regola non produce
    più risulta risolto, e nessuno ha corretto nulla. Rieseguire la scansione
    dello stato precedente con il motore attuale prima di leggere questi numeri
    come remediation.
  configuration_unknown: >
    Una delle due scansioni non registra con quale configurazione del motore è
    stata prodotta, quindi non si può dimostrare che siano la stessa analisi.
    Leggere il confronto come indicativo, non come misura.
  note: >
    Un rilievo «risolto» significa che non è più osservabile con lo stesso
    metodo, non che la causa sia stata rimossa: un tracker presente solo su
    altre pagine sparisce da questo confronto pur restando attivo.

