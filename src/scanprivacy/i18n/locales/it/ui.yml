  not_conformant_note: Presenti rilievi che richiedono intervento prima di considerare il sito conforme.
  inconclusive_note: "Il sito non è stato caricato: l'esito non è un esito favorevole."
  inconclusive_blocking: osservazione non riuscita — nessun rilievo può essere escluso
