constraint:
  response_headers_fixed:
    github-pages: >
      GitHub Pages invia un insieme fisso di header di risposta e non offre alcun
      modo per aggiungerne uno: nessun file di configurazione, nessuna
      impostazione, nessuna regola sugli header. Il rilievo è fondato e
      l'esposizione è reale, ma non può essere chiuso finché il sito è servito da
      questa piattaforma.

platform:
  wordpress:
    hint: >
      Gli interventi si fanno tipicamente a livello di tema (header.php /
      functions.php) o disattivando il plugin che inietta la risorsa. Verificare
      Jetpack (Stats, Photon), Gravatar e i plugin di condivisione social.
  astro:
    hint: >
      Sito statico: gli interventi si fanno nei componenti .astro e nel layout
      base, poi rebuild e redeploy. Gli header HTTP vanno impostati sul CDN o sul
      server che serve il build.
  nextjs:
    hint: Intervenire in app/layout o _document, e negli header di next.config.
  hugo:
    hint: Modificare i layout e i partial, poi rigenerare il sito.
  joomla:
    hint: >
      Intervenire sul template attivo e sui moduli; molti tracker sono inseriti
      da estensioni di terze parti.
  drupal:
    hint: Intervenire sul tema e sui moduli abilitati.
  shopify:
    hint: >
      Piattaforma in hosting: alcuni trasferimenti non sono eliminabili e vanno
      dichiarati; i tag aggiuntivi si tolgono dal tema o dalle app installate.
  wix:
    hint: >
      Piattaforma chiusa in hosting: il margine tecnico è limitato, quindi
      l'informativa deve dichiarare il fornitore e i suoi trattamenti.
  squarespace:
    hint: "Piattaforma in hosting: intervenire da Impostazioni → Cookies & Visitor Data."
  opencity-italia:
    hint: >
      Piattaforma open source per la PA: la correzione va portata al fornitore
      della piattaforma, così da sistemare tutti gli enti che la usano.
  municipium:
    hint: "Piattaforma PA fornita da Maggioli: aprire un ticket al fornitore."

