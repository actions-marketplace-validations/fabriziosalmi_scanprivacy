    inline_svg_icons: icone SVG inline
    local_avatars: avatar generati localmente
    brevo: Brevo (FR)
    mailerlite: MailerLite
    listmonk: Listmonk (self-hosted)
    cal_com_self_hosted: Cal.com (self-hosted)
