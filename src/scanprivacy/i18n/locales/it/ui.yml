consent_pass:
  verification:
    field_verified: >
      verificato sul campo — questa esatta chiamata è stata eseguita contro
      un'installazione reale della piattaforma e si è osservato che fa quanto il
      fornitore dichiara.
    documented: >
      solo documentato — trascritto dalla documentazione del fornitore e mai
      eseguito contro un'installazione reale. La chiamata può esistere,
      terminare senza errori e non fare nulla: dall'esterno della pagina questo
      è indistinguibile da un sito che ha ignorato il rifiuto. I rilievi di
      questa passata sono espressi come indizi, non come fatti.
  title: Passata di rifiuto — {domain}
  document_title: "Passata di rifiuto — {domain}"
  description: >
    Che cosa fa {domain} dopo che il visitatore ha rifiutato il consenso,
    misurato attraverso la via di rifiuto documentata dal fornitore stesso della
    piattaforma di consenso.
  intro: >
    Questa è una verifica separata con un metodo separato. Il report standard
    osserva un visitatore che non ha deciso e non tocca mai la pagina. Questa
    esercita il rifiuto che il sito stesso offre, ricarica e confronta. Le due
    rispondono a domande diverse e non sono mescolate di proposito.
  outcome:
    refused: rifiuto eseguito attraverso la via documentata
    no_consent_mechanism: nessun meccanismo di consenso rilevato, niente da rifiutare
    platform_not_recognised: meccanismo di consenso presente, nessuna via di rifiuto documentata nota
    platform_not_ready: piattaforma di consenso rilevata ma con interfaccia non pronta
    control_ambiguous: il controllo documentato corrispondeva a più di un elemento, quindi non è stato premuto nulla
    refusal_failed: la via di rifiuto documentata è stata tentata e non è andata a buon fine
  summary:
    honoured: >
      Dopo il rifiuto e un nuovo caricamento della pagina, nessun servizio che
      richiede consenso è stato contattato e nessun identificatore di
      tracciamento è rimasto sul dispositivo.
    survived: >
      Dopo il rifiuto e un nuovo caricamento della pagina, {vendors} servizi che
      richiedono consenso sono stati contattati ugualmente e {tracking}
      identificatori di tracciamento erano ancora presenti sul dispositivo.
  footer: "scanprivacy · passata di rifiuto · non costituisce parere legale"
  labels:
    third_parties_after: Terze parti contattate dopo il rifiuto
    cookies_after: Cookie presenti dopo il rifiuto
    storage_after: Chiavi di memoria dopo il rifiuto
    platform: Piattaforma di consenso
    method: Metodo
    action: Che cosa è stato eseguito esattamente
    documentation: Documentazione del fornitore
    verification: Quanto è provato questo percorso
    outcome: Esito
    markers: Marcatori rilevati
    before: Prima del rifiuto
    after: Dopo il rifiuto
    survived: Ancora presente dopo il rifiuto
  posture:
    method_refusal: >
      la pagina viene caricata, il meccanismo di consenso viene rifiutato per la
      via documentata dal fornitore stesso, la pagina viene ricaricata e le due
      osservazioni vengono confrontate
    interaction_refusal: >
      esattamente un'azione: la chiamata di rifiuto documentata oppure un click
      sull'unico controllo pubblicato dal fornitore. Nessun altro click, nessun
      modulo inviato, nessuna navigazione, nessun secondo tentativo con un
      metodo diverso
    platform_limit: >
      solo le piattaforme di consenso presenti nel catalogo del motore,
      identificate dalla loro stessa verifica di prontezza. Una piattaforma non
      riconosciuta viene dichiarata come tale e lasciata intatta
    meaning: >
      un rifiuto espresso da un agente automatico misura il comportamento
      tecnico del meccanismo; non è l'esercizio della volontà di un interessato

fleet:
  footer: "scanprivacy · verifica del parco siti · non costituisce parere legale"
  quick_wins: "{n} rilievi nel parco siti sono interventi a impegno basso su rilievi gravi."
  posture:
    courtesy: >
      ogni obiettivo condivide un solo budget di cortesia per host: decine di siti
      dietro un unico fornitore di hosting non devono sommarsi in un test di carico
  limits:
    aggregate: >
      Un aggregato dice quanto spesso una cosa ricorre, mai quanto è grave per un
      singolo sito: un rilievo ripetuto su quaranta siti può essere un template da
      correggere, e un rilievo su un sito solo può essere quello che conta. I report
      per singolo sito restano il documento di riferimento.
  title: Verifica privacy del parco siti
  headline: >
    {scanned} obiettivi osservati su {targets} ({failed} irraggiungibili). {actionable} presentano un rilievo oltre l'informativo, {affected} ne presentano almeno uno di qualunque tipo, {clean} nessuno.
  headings:
    repeated: Che cosa si ripete nel parco siti
    vendors: Terze parti, per quanti siti le usano
    targets: Tutti gli obiettivi
    clean: Siti senza rilievi
  labels:
    courtesy: Cortesia
    grade: Esito
    sites: Siti
    site: Sito
    examples: Esempi
    undeclared_on: Non dichiarata su
    pages: Pagine
  legend:
    grades: >
      Un esito per sito, sulla scala fail-closed: F con un rilievo critico, D con uno alto, C medio, B basso, A pulito.
    repeated: >
      Ordinato per numero di siti interessati, mai per numero di rilievi: lo
      stesso CDN di caratteri su trenta siti è una decisione presa una volta e
      ripetuta, non trenta problemi. Correggerla dove è stata presa li risolve
      tutti.
    vendors: >
      Una terza parte usata in tutto il parco siti sta in una voce del registro
      dei responsabili e in un contratto, non in trenta conversazioni separate.

dpia:
  heading: Screening per la valutazione d'impatto
  transfers_heading: Trasferimenti da valutare
  legend: >
    Uno screening, mai una determinazione. Conta i criteri visibili dall'esterno
    e nomina quelli che non lo sono: un report che si presentasse come completo
    permetterebbe di concludere «nessuna valutazione necessaria» a partire da
    un'evidenza che non ha mai coperto la domanda.
  transfers_legend: >
    Per ogni destinatario fuori dal SEE, le domande a cui una valutazione
    d'impatto sul trasferimento deve rispondere, precompilate con quanto
    osservato. Dove la knowledge base ha un equivalente, è indicato: la
    valutazione d'impatto meno costosa è il trasferimento che non si fa.
  met: Soddisfatti sulla superficie osservabile
  not_assessable: Non valutabili dall'esterno — a cui deve rispondere il titolare
  threshold: Due o più criteri soddisfatti richiedono di norma una valutazione.
  labels:
    criterion: Criterio
    state: Stato
    evidence: Che cosa è stato osservato
    recipient: Destinatario
    country: Paese
    basis: Base del trasferimento
    data: Dati comunicati
    declared: Dichiarato
    alternatives: Equivalenti che eliminerebbero il trasferimento
    questions: Domande a cui la valutazione deve rispondere
  questions:
    - Quale soggetto riceve effettivamente i dati e in quale paese è stabilito?
    - Su quale base si fonda il trasferimento, ed è disponibile copia dello strumento?
    - >
      Il destinatario è soggetto a normative che consentono l'accesso delle
      autorità pubbliche oltre quanto il diritto dell'Unione ammetterebbe?
    - Quali misure supplementari si applicano — cifratura, pseudonimizzazione, contrattuali e organizzative?
    - Il trasferimento è davvero necessario, o esiste un equivalente all'interno del SEE?
  criteria:
    evaluation_scoring: Valutazione o attribuzione di punteggio, inclusa la profilazione
    automated_decision: Decisioni automatizzate con effetti giuridici o similmente significativi
    systematic_monitoring: Monitoraggio sistematico degli interessati
    sensitive_data: Categorie particolari di dati, o dati di natura altamente personale
    large_scale: Trattamento su larga scala
    matching_combining: Combinazione o raffronto di insiemi di dati
    vulnerable_subjects: Dati relativi a interessati vulnerabili
    innovative_technology: Uso innovativo di nuove tecnologie
    prevents_rights: Trattamento che impedisce agli interessati di esercitare un diritto o avvalersi di un servizio
